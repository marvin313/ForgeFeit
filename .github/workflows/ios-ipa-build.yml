name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-ipa:
    name: Test and package ForgeFit
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Create test configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY repository secret." >&2
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env

      - name: Generate Drift and Dart sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Prepare Flutter iOS artifacts
        run: flutter precache --ios

      - name: Install CocoaPods dependencies
        run: |
          if [[ -f ios/Podfile ]]; then
            (cd ios && pod install --repo-update)
          else
            echo "No Podfile: this Flutter stable template resolves iOS plugins with Swift Package Manager."
          fi

      - name: Run unit tests
        run: flutter test

      - name: Run static analysis
        run: flutter analyze

      - name: Build iOS Release without code signing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Package unsigned IPA
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          /usr/bin/zip -qry ForgeFit-unsigned.ipa Payload
          test -f ForgeFit-unsigned.ipa

      - name: Upload ForgeFit unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ForgeFit-unsigned
          path: build/ios/ipa/ForgeFit-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
